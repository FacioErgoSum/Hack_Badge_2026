; Sketch - standalone ESP-IDF firmware for the 2026 Supercon billboard badge.
;
;   pio run                 build
;   pio run -t upload       build and flash over the badge's USB port
;   pio device monitor      watch the log (115200, USB Serial/JTAG)
;
; Same module as firmware/esp32s3-itc97 in the Hackaday repo: ESP32-S3 with
; 16 MB QIO flash and 8 MB octal PSRAM. PSRAM and the rest of the chip config
; live in sdkconfig.defaults.

[env:badge]
platform  = espressif32@6.9.0      ; ESP-IDF 5.3.1
board     = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode    = qio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

upload_speed    = 460800
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
